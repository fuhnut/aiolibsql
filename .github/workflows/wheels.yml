name: Build Wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto

          # Linux x86_64 musl / Alpine
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2

          # Linux i686
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            manylinux: auto

          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_qemu: true
            manylinux: '2_28'

          # Linux ARM64 musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_qemu: true
            manylinux: musllinux_1_2

          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto

          # macOS Intel
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            manylinux: auto

          # macOS Universal2
          - os: macos-latest
            target: universal2-apple-darwin
            manylinux: auto

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.use_qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release
            --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.14

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  collect:
    name: Collect all wheels
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: all-wheels
          path: dist/*.whl
          if-no-files-found: error